<!doctype html>
<!--
  tela-scan FIXTURE: the same invented data as custos-ruim.html, with the boxes
  back. EXPECTED: zero findings. The regression runs custos-bom -> custos-ruim
  and must report perdeu-contentor, perdeu-controle, perdeu-chip, perdeu-largura;
  the other way it must report nothing.
-->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Custos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 14px/1.5 sans-serif; background: #0b0b0c; color: #d4d4d8; display: flex; min-height: 100vh; }
  .side { width: 240px; flex: none; border-right: 1px solid #27272a; padding: 16px; }
  .side a { display: block; color: #a1a1aa; padding: 6px 0; }
  main { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
  h1 { font-size: 22px; font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .tabs button { padding: 6px 12px; background: #18181b; color: #d4d4d8; border: 1px solid #27272a; border-radius: 6px; cursor: pointer; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { background: #141416; border: 1px solid #27272a; border-radius: 12px; padding: 16px; }
  .num { font-size: 26px; font-weight: 600; color: #fafafa; display: block; }
  .muted { color: #a1a1aa; font-size: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .chip { display: inline-block; font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 999px; background: #052e16; color: #4ade80; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style></head>
<body>
  <nav class="side"><a href="#a">Conversas</a><a href="#b">Custos</a><a href="#c">Saúde</a><a href="#d">Memória</a></nav>
  <main>
    <div class="head"><h1>Custos</h1><div class="tabs"><button type="button" onclick="void 0">7 dias</button> <button type="button" onclick="void 0">30 dias</button> <button type="button" onclick="void 0">Exportar</button></div></div>
    <div class="tiles">
      <div class="card"><span class="muted">Total do período</span><span class="num">US$ 12,40</span></div>
      <div class="card"><span class="muted">Modelos</span><span class="num">US$ 11,10</span></div>
      <div class="card"><span class="muted">Transcrição</span><span class="num">US$ 0,80</span></div>
      <div class="card"><span class="muted">Mensagens de voz</span><span class="num">US$ 0,50</span></div>
    </div>
    <div class="tiles">
      <div class="card"><span class="muted">Fatos</span><span class="num">120</span></div>
      <div class="card"><span class="muted">Pessoas</span><span class="num">14</span></div>
      <div class="card"><span class="muted">Projetos</span><span class="num">8</span></div>
      <div class="card"><span class="muted">Conversas</span><span class="num">32</span></div>
    </div>
    <div class="two">
      <div class="card">
        <div class="row"><span>Banco de dados</span><span class="chip">Ok</span></div>
        <div class="row"><span>Fila de envios</span><span class="chip">Ok</span></div>
        <div class="row"><span>Serviço de voz</span><span class="chip">Ok</span></div>
        <div class="row"><span>Armazenamento</span><span class="chip">Ok</span></div>
        <div class="row"><span>Agendador</span><span class="chip">Ok</span></div>
        <div class="row"><span>Canal de mensagens</span><span class="chip">Ok</span></div>
      </div>
      <div class="card"><span class="muted">Consumo nos últimos dias</span>
        <svg width="100%" height="120" viewBox="0 0 400 120" role="img" aria-label="consumo"><polyline points="0,100 100,60 200,70 300,30 400,40" fill="none" stroke="#4ade80" stroke-width="2"/></svg>
      </div>
    </div>
  </main>
</body></html>
